aid: appsmith
name: Appsmith
description: >-
  Appsmith is an open source (Apache-2.0) low-code platform for building internal tools, admin panels and
  workflow applications on top of 25+ databases and any REST or GraphQL API. It runs self-hosted via Docker,
  Kubernetes or Helm, or as Appsmith Cloud. Its agent surface is a first-party Model Context Protocol server
  bundled into the Appsmith image and fronted at /mcp, exposing 61 tools that build and edit applications
  under the calling user's own permissions; it ships disabled by default and requires a per-user mcp_ token.
  Appsmith publishes no public REST API reference: the platform API at /api/v1 is undocumented editor traffic
  and its springdoc OpenAPI surface is disabled by default and authenticated when enabled.
