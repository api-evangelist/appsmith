name: Appsmith MCP <-> REST tool crosswalk
note: 'NO BINDINGS ARE ASSERTED. Appsmith publishes no machine-readable REST contract: the Spring server carries a
  springdoc surface but application-ce.properties ships springdoc.api-docs.enabled=false / springdoc.swagger-ui.enabled=false,
  and OpenApiDocsAuthTest.java asserts /v3/docs and /v3/swagger-ui.html return 401 unauthenticated (GHSA-v6jh-fx3m-7xhw).
  A live probe of https://app.appsmith.com/api/v3/docs returned 401 on 2026-09-04. The three OpenAPI files in this
  repo are a 5-operation API Evangelist scaffold, NOT a provider document, and they do not survive contact with the
  live API: GET https://app.appsmith.com/api/v1/applications (the scaffold operation listApplications) returns HTTP
  405 METHOD_NOT_ALLOWED. Binding real MCP tools to those operationIds would manufacture a mapping that does not exist,
  so every tool is recorded as mcp_only.'
surfaces:
  openapi:
    present: false
    gated: true
    paths:
    - /v3/docs
    - /v3/swagger
    status: disabled by default (springdoc.api-docs.enabled=false) and 401 when enabled
    evidence: https://app.appsmith.com/api/v3/docs -> 401
  rest:
    present: true
    base: https://app.appsmith.com/api/v1
    documented: false
    note: The REST surface is live and answers with the responseMeta envelope, but is documented only as internal
      editor traffic — there is no public API reference.
  graphql:
    present: false
    note: Appsmith consumes GraphQL as a datasource type (create_graphql_query); it does not expose a GraphQL API
      of its own.
  mcp:
    present: true
    endpoint: https://{your-appsmith-instance}/mcp
    gated: true
    note: Off by default; requires APPSMITH_MCP_ENABLED and a user-scoped mcp_ bearer token.
