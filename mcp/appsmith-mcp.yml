name: Appsmith MCP server
status: published
maturity: beta
deployment:
  mode: remote
  endpoint: https://{your-appsmith-instance}/mcp
  auth: api-key
  verified: searched
  note: 'Self-hosted/templated endpoint. The server is not a separate download: it is bundled into the Appsmith Docker
    image (deploy/docker/fs/opt/appsmith/run-mcp.sh execs /opt/appsmith/mcp/bundle/server.js), binds 127.0.0.1:8092
    (APPSMITH_MCP_PORT) and is fronted by Caddy at the /mcp path of the instance origin. An MCP client therefore POSTs
    to https://<your-appsmith-host>/mcp. There is NO vendor-hosted endpoint: a POST to https://app.appsmith.com/mcp
    on 2026-09-04 was rejected by CloudFront with HTTP 403 "This distribution is not configured to allow the HTTP
    request method that was used" — Appsmith Cloud does not expose the MCP route.'
authentication:
  scheme: bearer
  token_prefix: mcp_
  issued_from: Appsmith Profile -> MCP tokens (per-user, user-scoped)
  note: Every tool call is bounded by the calling user's own ACL. While APPSMITH_MCP_ENABLED is off the auth filter
    rejects mcp_ tokens with 401 and they cannot be created or rotated at all.
  rate_limit: 5 authentication attempts per minute (bucket key mcp_authentication, RateLimitConfig.java)
enablement:
  default: disabled
  note: Off by default on new deployments AND on upgrades — an existing instance never acquires an agent-facing endpoint
    by taking an image upgrade. Each layer is a separate Admin Settings switch / env var.
  gates:
  - variable: APPSMITH_MCP_ENABLED
    default: 'off'
    effect: While off /mcp returns 404 mcp_disabled JSON and mcp_ tokens are rejected server-side (401).
  - variable: APPSMITH_MCP_DATA_ENABLED
    default: 'off'
    effect: While off the datasource/query tools are unregistered; spec authoring + reads remain.
  - variable: APPSMITH_MCP_JS_ENABLED
    default: 'off'
    effect: While off the restricted JS-object tools are unregistered.
  backend_requirements: Governed and destructive tools additionally require MongoDB + Redis (APPSMITH_MONGODB_URI
    / APPSMITH_DB_URL and APPSMITH_REDIS_URL); without them the server starts with read + spec-authoring tools only.
session_limits:
- variable: APPSMITH_MCP_MAX_SESSIONS
  default: 100
  effect: Instance-wide concurrent session cap; hard HTTP 503 when full.
- variable: APPSMITH_MCP_MAX_SESSIONS_PER_USER
  default: 25
  effect: At the cap the user's own least-recently-active session is evicted rather than rejecting the new one.
- variable: APPSMITH_MCP_SESSION_TTL_MS
  default: 900000
  effect: Idle session lifetime (15 min); every request refreshes the TTL.
safety_model:
  closed_vocabulary: Agents never author raw widget DSL, SQL, JS or {{ }} bindings — they call tools and the server
    compiles them under the caller's own permissions.
  prepare_confirm: Every destructive operation is a prepare_*/confirm_* pair. prepare_* returns a one-time confirmation
    with a 5-minute TTL bound to the app, branch, message and current content revision; drift between prepare and
    confirm fails.
  elicitation: On clients that declare MCP elicitation support, confirm_* prompts the human directly; otherwise the
    one-time token plus relay text is the fallback "relay posture". Bounded at 3 prompts per confirmation and 20 approval
    prompts per session (elicitation_budget_exhausted).
  git_branch_gate: Every mutating tool targeting a git-connected application requires a branch parameter matching
    the current branch; the gate fails closed (git_state_unknown) when git state cannot be read.
  agent_branch_namespace: Agent branches are confined to the reserved mcp/ prefix (max 5 per application); commits
    are refused on any other branch (git_commit_branch_forbidden) and the server prepends a non-strippable "[mcp]
    " marker to every commit message.
